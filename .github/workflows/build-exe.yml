name: Build Windows EXE

# يُبنى DriverToolbox.exe على خادم ويندوز من GitHub كلما تغيّر الكود،
# ويُنشر كإصدار باسم رقم الإصدار المكتوب في APP_VERSION داخل driver_toolbox.py.
on:
  push:
    branches: ["main"]
    paths:
      - "driver_toolbox.py"
      - "RELEASE_NOTES.md"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Read version and smoke-test the logic
        id: ver
        shell: bash
        run: |
          v=$(python -c "import driver_toolbox as m; assert m.tk is not None; m.list_backups(__import__('pathlib').Path('.')); print(m.APP_VERSION)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Build EXE
        run: pyinstaller --onefile --windowed --uac-admin --name DriverToolbox driver_toolbox.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriverToolbox-${{ steps.ver.outputs.version }}
          path: dist/DriverToolbox.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: نسخ التعريفات v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/DriverToolbox.exe
          body_path: RELEASE_NOTES.md
          make_latest: true
